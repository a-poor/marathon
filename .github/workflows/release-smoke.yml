name: Release smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    name: Release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
      - name: Cover every configured release target
        id: matrix
        run: |
          release_matrix=$(python scripts/release-config.py)
          echo "matrix=$release_matrix" >> "$GITHUB_OUTPUT"

  smoke:
    name: Archive (${{ matrix.target }})
    needs: config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/release-smoke-requirements.txt
      - name: Install release build tools
        run: python -m pip install -r scripts/release-smoke-requirements.txt
      - name: Select this target from the release configuration
        run: python scripts/release-config.py ${{ matrix.target }}
      # Tools are provisioned above, so the global installation hooks are skipped.
      # Snapshot mode creates archives/checksums without publishing or tap updates.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=before --config target/release-smoke.yaml
      - name: Test the packaged executable
        run: python scripts/release-smoke.py target/release-smoke
